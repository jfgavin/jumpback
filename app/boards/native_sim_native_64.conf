#
# Host-build counterpart to the RLCD board's Kconfig.defconfig.
#
# The target board pins LVGL to 1 bit per pixel in its own board defconfig,
# which the app therefore never has to state. native_sim has no such
# defconfig, so without this it renders at the generic 16bpp default while the
# overlay hands it a MONO01 panel - and the two disagreeing is what cost the
# sim its draw buffer.

# LVGL's render depth. Must agree with the overlay's MONO01 panel: LVGL sizes
# its draw buffer from this but picks its blend routine from the display's
# reported format, so a mismatch overruns the buffer rather than producing a
# wrong-looking image.
CONFIG_LV_COLOR_DEPTH_1=y

# The same depth as the Zephyr glue sizes buffers with. Follows
# LV_COLOR_DEPTH_1 by default; set explicitly because this is the value that
# actually governs the allocation.
CONFIG_LV_Z_BITS_PER_PIXEL=1

# The real panel's driver reports SCREEN_INFO_X_ALIGNMENT_WIDTH and has the
# rounder widen every area to the full width. The SDL display has no such
# constraint, so the sim keeps the default alignment of 1 and relies on
# CONFIG_LV_Z_FULL_REFRESH (set in prj.conf) for the same whole-screen flush.

# Pack monochrome bytes horizontally, as the ST7306 driver does. The SDL
# display defaults to vertical tiling; both it and Zephyr's mono glue read the
# same SCREEN_INFO flags, so either setting renders correctly here - this one
# just makes the sim exercise the same packing as the hardware.
CONFIG_SDL_DISPLAY_MONO_VTILED=n
