title: ST7306 landscape display on the Waveshare ESP32-S3-RLCD-4.2

description: |
  Presents the physically portrait ST7306 panel as a landscape display by
  rotating the framebuffer in software. width and height are the landscape
  resolution the application draws into; panel-width and panel-height are the
  glass in its own portrait orientation, and must be their transpose.

  Register field values are named in dt-bindings/display/st7306.h.

compatible: "waveshare,st7306-landscape"

include: [mipi-dbi-spi-device.yaml, display-controller.yaml]

properties:
  panel-width:
    type: int
    required: true
    description: Portrait glass width in pixels. Multiple of ST7306_PIXELS_PER_COL_ADDR.

  panel-height:
    type: int
    required: true
    description: Portrait glass height in pixels. Multiple of 8.

  start-line:
    type: int
    required: true
    description: First gate line of display RAM shown on the glass.

  start-column:
    type: int
    required: true
    description: |
      First RAM column wired to glass, in pixels. Multiple of
      ST7306_PIXELS_PER_COL_ADDR.

  nvm-load:
    type: uint8-array
    required: true
    description: NVM_LOAD (0xD6) parameters.

  gate-voltages:
    type: uint8-array
    required: true
    description: GATE_VOLTAGE (0xC0) parameters.

  vsh:
    type: uint8-array
    required: true
    description: VSH (0xC1) high positive source voltage, per mode.

  vsl:
    type: uint8-array
    required: true
    description: VSL (0xC2) low positive source voltage, per mode.

  vshn:
    type: uint8-array
    required: true
    description: VSHN (0xC4) high negative source voltage, per mode.

  vsln:
    type: uint8-array
    required: true
    description: VSLN (0xC5) low negative source voltage, per mode.

  osc-settings:
    type: int
    required: true
    description: OSC_SETTINGS (0xD8) first parameter. See ST7306_OSC_*.

  framerate:
    type: int
    required: true
    description: FRAMERATE (0xB2). See ST7306_FRAMERATE_*.

  multiplex-ratio:
    type: int
    required: true
    description: GATESET (0xB0). Gate lines / ST7306_GATE_LINES_PER_MULTIPLEX_STEP.

  source-voltage:
    type: int
    required: true
    description: VSHLSEL (0xC9) source voltage mode.

  remap-value:
    type: int
    required: true
    description: MADCTL (0x36). See ST7306_MADCTL_*; MV must be clear and MX set.

  panel-settings:
    type: int
    required: true
    description: PNLSET (0xB8).

  hpm-gate-waveform:
    type: uint8-array
    default: [0xE5, 0xF6, 0x05, 0x46, 0x77, 0x77, 0x77, 0x77, 0x76, 0x45]
    description: HPM_GATE_WAVEFORM (0xB3).

  lpm-gate-waveform:
    type: uint8-array
    default: [0x05, 0x46, 0x77, 0x77, 0x77, 0x77, 0x76, 0x45]
    description: LPM_GATE_WAVEFORM (0xB4).

  inversion-on:
    type: boolean
    description: Send SET_REVERSE_DISPLAY instead of SET_NORMAL_DISPLAY.

  low-power-mode:
    type: boolean
    description: Run in low power mode instead of high power mode.
