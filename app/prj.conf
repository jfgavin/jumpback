# Display driver stack. The concrete panel is selected by devicetree:
# zephyr,sdl-dc on native_sim, a real controller node on hardware.
CONFIG_DISPLAY=y

# LVGL and the Zephyr glue that feeds it the display device.
CONFIG_LVGL=y

# Heap LVGL allocates objects, draw tasks and its draw buffers from. The
# tachometer queues a tick and a label task per 1000 RPM on top of the track
# draws, and each is a separate allocation; at 16K lv_draw_add_task() returned
# NULL and LVGL dereferenced it without a diagnostic.
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# Turn allocation failures into a logged assert instead of a bare segfault.
CONFIG_LV_USE_ASSERT_MALLOC=y

# LVGL runs on the main thread here, so main needs a deeper stack than the
# 1K default.
CONFIG_MAIN_STACK_SIZE=4096

# Logging, so LVGL and the display driver can report failures.
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

# Log synchronously from the calling context rather than queueing to the log
# thread. Deferred mode drops or delays output when the caller loops tightly,
# and on this board the console is USB Serial/JTAG, which discards anything
# written while no terminal is attached - so a delayed line is a lost line.
CONFIG_LOG_MODE_IMMEDIATE=y

# Redraw the whole panel each frame rather than the dirty rectangle.
#
# The landscape driver accepts full-frame writes only. A partial landscape
# area maps to a partial panel area whose column span must still land on the
# controller's 12-pixel boundaries, and supporting that would mean carrying a
# second addressing path through the rotation for no visible gain on a panel
# that redraws its whole gauge each frame anyway.
#
# The driver reports SCREEN_INFO_X_ALIGNMENT_WIDTH so Zephyr's mono rounder
# widens every invalidated area to the full width; this setting supplies the
# other half, making the flush the whole screen.
CONFIG_LV_Z_FULL_REFRESH=y

# Larger face for on-screen numerals. At 1bpp there is no antialiasing, so the
# default small font renders as broken pixel runs; a bigger face stays legible.
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# Stage the whole rotated frame before sending it, rather than 16 row-address
# strips at a time.
#
# One strip is one row address: two panel rows of 300 pixels at 1bpp, so 75
# bytes. The driver's default of 16 sends the 200-strip frame in 13 SPI
# transactions; 200 makes it one, at a cost of 15000 bytes of RAM instead of
# 1200. That trades RAM for fewer per-transaction setup costs, which is the
# right way round on this board - it has 8 MB of PSRAM and no power budget to
# speak of.
CONFIG_ST7306_WAVESHARE_CONV_BUFFER_STRIPS=200
